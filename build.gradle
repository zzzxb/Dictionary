allprojects {
    version = '1.0'
    ext {
        appName = "Dictionary"
        // 1.9.8 的 macOS 原生库(libgdx.dylib)是 32 位 i386, 在 Apple Silicon(M 系列) + 现代 macOS 上
        // 已经无法加载, 报 UnsatisfiedLinkError: Can't load library .../libgdx.dylib
        // 1.9.14 起 libGDX 才提供 arm64 的 macOS 原生库, 这里直接用 1.14.x
        gdxVersion = '1.14.1'
    }

    repositories {
        mavenCentral()
        google()
    }

    // 源码里有中文, 强制 UTF-8, 否则新 JDK 下可能乱码
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

project(":desktop") {
    apply plugin: "java"

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        // LWJGL3 后端: 支持 Apple Silicon(内含 lwjgl natives-macos-arm64)
        // 旧的 gdx-backend-lwjgl(2.x) 根本没有 arm64 原生库, 已经没人维护了
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java"

    dependencies {
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    }
}
